[project]
name = "indoorgs"
version = "0.0.1"
description = "실내 공간 원클릭 3DGS: 영상 -> 추출 -> 정합(도면·동선 보조) -> 학습 -> 보강 -> 한 건물 PLY"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
gui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27"]   # httpx: FastAPI TestClient (GUI 테스트)

[project.scripts]
indoorgs = "indoorgs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
indoorgs = ["gui/static/*"]   # GUI 화면 파일
